- !NewsroomRequest
  method: POST
  path: /newsroom/api/v1/auth/token
  data:
    user_email: !Stabilized.default.email teSt@eXample.com
    sendEmail: 1
    emailLink: 'https://example.com/external-auth-destination'
    emailText: 'Action button text.'
    key: !Capture '<signature key 0>'
    app: !Stabilized.default.app_id test-app-id
- !Response
  data: 'Email sent.'
