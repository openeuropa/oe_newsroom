name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - 1.x

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version:
          - "8.1"
          - "8.3"
        core_version:
          - "10.5.0"
          - "10.6.0"
          - "11.2.0"
          - "11.3.0"
        exclude:
          - php_version: "8.1"
            core_version: "11.2.0"
          - php_version: "8.1"
            core_version: "11.3.0"
    env:
      PHP_VERSION: ${{ matrix.php_version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v2

      - name: Modify web container version
        run: |
          # Set the php version, and replace -dev with -ci.
          sed -i 's/httpd-php:8\.3-\(dev\|ci\)/httpd-php:${{ matrix.php_version}}-ci/g' docker-compose.yml
          # Report the difference.
          git diff

      - name: Start services with Docker Compose
        run: docker compose up -d

      - run: docker compose exec -T web composer self-update

      - name: Build dependencies
        run: >
          docker compose exec -T web composer require
          drupal/core:~${{ matrix.core_version }}
          drupal/core-composer-scaffold:~${{ matrix.core_version }}
          drupal/core-dev:~${{ matrix.core_version }}
          --update-with-all-dependencies --ansi --no-progress --no-interaction

      - name: Run grumphp
        run: docker compose exec -T web ./vendor/bin/grumphp run

      - name: Run phpunit
        run: docker compose exec -T web ./vendor/bin/phpunit
