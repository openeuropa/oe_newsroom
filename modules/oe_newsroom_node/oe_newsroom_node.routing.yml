oe_newsroom_node.subscribe_form:
  path: '/newsroom-node/{node}/subscribe'
  defaults:
    _form: '\Drupal\oe_newsroom_node\Form\NodeSubscribeForm'
    _title_callback: '\Drupal\oe_newsroom_node\Form\NodeSubscribeForm::title'
  requirements:
    _oe_newsroom_node_subscribe_access: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

oe_newsroom_node.subscribe_verify:
  path: '/newsroom-node/{node}/subscribe-verify'
  defaults:
    _controller: '\Drupal\oe_newsroom_node\Controller\NodeSubscribeController::verify'
  requirements:
    _oe_newsroom_node_subscribe_access: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
