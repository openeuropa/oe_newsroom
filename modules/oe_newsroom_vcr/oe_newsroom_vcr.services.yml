services:
  _defaults:
    autowire: true
    tags:
      # The service tag marks all services as candidates for the API explorer.
      # Only those which have the attribute will actually be explorable.
      - { name: oe_newsroom_api_explorer }
  Drupal\oe_newsroom_vcr\Capture\CaptureStore: {}
  Drupal\oe_newsroom_vcr\Vcr\VcrStore: {}
  Drupal\oe_newsroom_vcr\Vcr\VcrRuntimeInterface: '@Drupal\oe_newsroom_vcr\Vcr\VcrStore'
  Drupal\oe_newsroom_vcr\Explorer\VcrApiExplorerOperations: {}
  Drupal\oe_newsroom_vcr\Http\RequestMapper: {}
  Drupal\oe_newsroom_vcr\Http\ResponseMapper: {}
  Drupal\oe_newsroom_vcr\Http\ClientMiddleware:
    tags:
      - { name: http_client_middleware }
