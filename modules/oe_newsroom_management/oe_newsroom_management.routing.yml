oe_newsroom_management.node_subscriptions_management_anonymous:
  path: '/oe-newsroom-management/subscriptions-management/{email}/{token}'
  defaults:
    _title: 'Subscriptions Management'
    _controller: '\Drupal\oe_newsroom_management\Controller\NodeSubscriptions::anonymousManagementPage'
  requirements:
    _user_is_logged_in: 'FALSE'
  options:
    no_cache: TRUE

oe_newsroom_management.node_subscriptions_management_authenticated:
  path: '/oe-newsroom-management/subscriptions-management'
  defaults:
    _title: 'Subscriptions Management'
    _controller: '\Drupal\oe_newsroom_management\Controller\NodeSubscriptions::authenticatedManagementPage'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

oe_newsroom_management.request_access:
  path: '/oe-newsroom-management/subscriptions-management/request-access'
  defaults:
    _title: 'Access to manage subscriptions'
    _form: 'Drupal\oe_newsroom_management\Form\RequestAccessForm'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
